# Build and verify the Windows installer on a real Windows runner.
#
# Why this exists: the OS-specific half of this project cannot be tested in the
# Linux sandbox it is developed in. No Electron binary can be downloaded there
# (the release-assets host is blocked), there is no display, and `safeStorage`
# on Linux is not DPAPI. Every statement about "the app runs on Windows" was
# therefore an inference rather than an observation.
#
# This workflow replaces the inference with an observation:
#   1. runs the full suite on windows-latest;
#   2. builds the NSIS installer;
#   3. launches the *packaged* application, headless-capable via PHUTRUE_SMOKE,
#      and asserts the account setup screen is really rendered;
#   4. publishes the .exe as a downloadable artifact.
#
# The self test is the important step. Steps 2 and 3 can both succeed while the
# window shows the wrong thing — that is precisely the bug this workflow was
# written in response to.

name: Windows

on:
  push:
    branches:
      - arena/a2f9f412-phutrue
  workflow_dispatch:

# Write access is needed for exactly one thing: on failure, the log is committed
# to the branch so it can be read from anywhere. Nothing else is ever pushed, and
# the commit is marked [skip ci] so it cannot start another run.
permissions:
  contents: write

jobs:
  build:
    name: Build and verify installer
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out the branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        # `npm ci` respects the lockfile exactly; `--no-audit` avoids a network
        # round trip that has no bearing on the build.
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npm run typecheck

      - name: Test
        # `--reporter=verbose` puts each failing assertion in the step log, which
        # is readable from the API without downloading artifacts.
        run: npx vitest run --reporter=verbose

      - name: Asset checks
        run: npm run assets:check

      - name: Build installer
        shell: pwsh
        run: |
          # Tee so the reason survives the step, whatever it is: electron-builder
          # failures are the one thing that cannot be reproduced on Linux.
          npm run dist 2>&1 | Tee-Object -FilePath dist-build.log
          if ($LASTEXITCODE -ne 0) {
            Write-Host '--- last 80 lines of dist-build.log ---'
            Get-Content dist-build.log -Tail 80 | Write-Host
            exit $LASTEXITCODE
          }
        env:
          # No code signing certificate exists yet. Setting this stops
          # electron-builder from searching for one and failing obscurely.
          # Publishing is disabled in the `dist` script itself with
          # `--publish never`, because CI detection alone would otherwise make
          # electron-builder try to create a GitHub release.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Locate the installer
        id: installer
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path release -Filter '*.exe' -File |
                 Where-Object { $_.Name -notmatch 'uninstall' } |
                 Sort-Object Length -Descending | Select-Object -First 1
          if (-not $exe) { throw 'No installer .exe was produced in release/' }
          Write-Host "Installer: $($exe.Name) ($($exe.Length) bytes)"
          "path=$($exe.FullName)" >> $env:GITHUB_OUTPUT
          "name=$($exe.Name)" >> $env:GITHUB_OUTPUT
          $hash = (Get-FileHash -Algorithm SHA256 -Path $exe.FullName).Hash
          "sha256=$hash" >> $env:GITHUB_OUTPUT
          "size=$($exe.Length)" >> $env:GITHUB_OUTPUT
          Write-Host "SHA256: $hash"

      # Verifying the *unpacked* build proves the packaged files are correct
      # before the NSIS wrapper is involved, which isolates packaging faults from
      # installer faults.
      - name: Verify the packaged app really shows the setup screen
        shell: pwsh
        run: |
          $app = Join-Path $PWD 'release\win-unpacked\Phutrue.exe'
          if (-not (Test-Path $app)) { throw "Packaged executable not found at $app" }

          $report = Join-Path $PWD 'smoke-report.json'
          $env:PHUTRUE_SMOKE = '1'
          $env:PHUTRUE_SMOKE_OUT = $report

          Write-Host 'Launching packaged app with PHUTRUE_SMOKE=1...'
          $proc = Start-Process -FilePath $app -PassThru -NoNewWindow
          # The app exits itself once the report is written. Give it a bound.
          if (-not $proc.WaitForExit(90000)) {
            Write-Host 'App did not exit; stopping it.'
            $proc.Kill()
            throw 'Smoke test timed out after 90s'
          }
          Write-Host "App exited with code $($proc.ExitCode)"

          if (-not (Test-Path $report)) { throw 'No smoke report was written' }
          Get-Content $report | Write-Host

          $json = Get-Content $report -Raw | ConvertFrom-Json
          if (-not $json.ok) {
            throw "Smoke test FAILED: url=$($json.url) mounted=$($json.rendererMounted) missing=$($json.missing -join ', ')"
          }
          if ($null -eq $json.schemaVersion -or $json.schemaVersion -lt 1) {
            throw "Smoke test FAILED: database schema version was $($json.schemaVersion)"
          }
          Write-Host "PASS: window rendered $($json.url) with the account setup screen, schema v$($json.schemaVersion)"

      # This is the failure a user actually hit on first install: an earlier
      # attempt left a phutrue.db behind, the migration could not complete, and
      # every later launch showed "could not start". No test that begins from an
      # empty directory can catch it, and the smoke test still passed because it
      # only ever looked at a window. So the poisoned state is reproduced here.
      - name: Start on a database left behind by a failed migration
        shell: pwsh
        run: |
          $userData = Join-Path $env:APPDATA 'Phutrue'
          New-Item -ItemType Directory -Force -Path $userData | Out-Null

          $dbPath = Join-Path $userData 'phutrue.db'
          Remove-Item -Force -ErrorAction SilentlyContinue $dbPath, "$dbPath-wal", "$dbPath-shm"

          # Build the exact leftover state with headless SQLite: some tables, no
          # schema_version, because the migration transaction rolled back.
          & node -e "
            const { DatabaseSync } = require('node:sqlite');
            const db = new DatabaseSync(process.argv[1]);
            db.exec('CREATE TABLE settings (key TEXT PRIMARY KEY, value TEXT NOT NULL)');
            db.exec('CREATE TABLE accounts (id INTEGER PRIMARY KEY, email TEXT)');
            db.exec('CREATE TABLE messages (id INTEGER PRIMARY KEY)');
            db.close();
          " $dbPath
          if (-not (Test-Path $dbPath)) { throw 'Could not seed the poisoned database' }
          Write-Host "Seeded a leftover database at $dbPath"

          $app = Join-Path $PWD 'release\win-unpacked\Phutrue.exe'
          $report = Join-Path $PWD 'recovered-smoke-report.json'
          Remove-Item -Force -ErrorAction SilentlyContinue $report
          $env:PHUTRUE_SMOKE = '1'
          $env:PHUTRUE_SMOKE_OUT = $report

          $proc = Start-Process -FilePath $app -PassThru -NoNewWindow
          if (-not $proc.WaitForExit(90000)) { $proc.Kill(); throw 'Recovery smoke test timed out' }
          Write-Host "App exited with code $($proc.ExitCode)"

          # Exit 0 with a report means it started, migrated and painted the screen.
          if ($proc.ExitCode -ne 0) {
            throw "App failed to start on a leftover database (exit $($proc.ExitCode)). This is the reported bug."
          }
          if (-not (Test-Path $report)) { throw 'No smoke report after recovery' }
          Get-Content $report | Write-Host
          $json = Get-Content $report -Raw | ConvertFrom-Json
          if (-not $json.ok) { throw "Recovery smoke FAILED: missing=$($json.missing -join ', ')" }
          if ($json.schemaVersion -lt 1) { throw "Recovery smoke FAILED: schema v$($json.schemaVersion)" }

          # The unusable file must be set aside, not deleted.
          $aside = Get-ChildItem -Path $userData -Filter 'phutrue.db.unusable-*' -ErrorAction SilentlyContinue
          if (-not $aside) { throw 'The leftover database was deleted instead of being set aside' }
          Write-Host "PASS: started normally and set the old file aside as $($aside.Name)"

          # Clean up so the install test starts from the same state a user would.
          Remove-Item -Force -Recurse -ErrorAction SilentlyContinue $userData

      # The installer itself must be launchable and its payload must be intact.
      # A full silent install is worth doing here: it is the only way to know the
      # .exe a user will download is not corrupt, and it runs in seconds.
      - name: Install silently and verify the installed app
        shell: pwsh
        run: |
          $installer = '${{ steps.installer.outputs.path }}'
          Write-Host 'Running the NSIS installer silently...'
          $p = Start-Process -FilePath $installer -ArgumentList '/S' -PassThru -Wait
          Write-Host "Installer exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "Installer failed with code $($p.ExitCode)" }

          $installed = Get-ChildItem -Path "$env:LOCALAPPDATA\Programs" -Filter 'Phutrue.exe' -Recurse -ErrorAction SilentlyContinue |
                       Select-Object -First 1
          if (-not $installed) { throw 'Installed Phutrue.exe not found after silent install' }
          Write-Host "Installed at: $($installed.FullName)"

          $report = Join-Path $PWD 'installed-smoke-report.json'
          $env:PHUTRUE_SMOKE = '1'
          $env:PHUTRUE_SMOKE_OUT = $report

          $proc = Start-Process -FilePath $installed.FullName -PassThru -NoNewWindow
          if (-not $proc.WaitForExit(90000)) { $proc.Kill(); throw 'Installed app smoke test timed out' }
          if (-not (Test-Path $report)) { throw 'No smoke report from the installed app' }

          Get-Content $report | Write-Host
          $json = Get-Content $report -Raw | ConvertFrom-Json
          if (-not $json.ok) {
            throw "INSTALLED app smoke FAILED: url=$($json.url) mounted=$($json.rendererMounted) missing=$($json.missing -join ', ')"
          }
          Write-Host 'PASS: the installed application shows the account setup screen'

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: phutrue-windows-installer
          path: ${{ steps.installer.outputs.path }}
          if-no-files-found: error
          retention-days: 14

      # Only the checksum is committed, not the installer.
      #
      # The .exe is ~120 MB and GitHub rejects any file over 100 MB, so it
      # cannot travel through a branch. The artifact upload above is how it
      # reaches a person. A checksum is a few dozen bytes and is what lets them
      # confirm the file they downloaded is the one this build produced, so that
      # part does get committed.
      - name: Publish checksum to the branch
        if: success()
        shell: pwsh
        run: |
          $dir = 'installers'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $name = '${{ steps.installer.outputs.name }}'
          $hash = '${{ steps.installer.outputs.sha256 }}'
          $size = '${{ steps.installer.outputs.size }}'

          "$hash  $name" | Out-File (Join-Path $dir "$name.sha256") -Encoding utf8 -NoNewline
          @"
          # Phutrue Windows installer

          | | |
          |---|---|
          | File | ``$name`` |
          | Size | $size bytes |
          | SHA-256 | ``$hash`` |
          | Commit | ``${{ github.sha }}`` |
          | Built and verified on | windows-latest, x64 |
          | Verified | the packaged app **and** the silently-installed app both rendered the account setup screen |
          | Recovery verified | starts normally on a database left behind by a failed migration, setting it aside intact |

          ## Downloading it

          The installer is too large for a git branch (GitHub caps files at 100 MB),
          so it is delivered as a workflow artifact:

          https://github.com/Gyeemi/Phutrue/actions/runs/${{ github.run_id }}

          Open that run and download **phutrue-windows-installer** from the
          Artifacts section at the bottom.

          ## Verifying the download

          ```powershell
          Get-FileHash -Algorithm SHA256 ".\$name"
          ```

          Compare against the SHA-256 above. They must match exactly.

          ## Installing

          The installer is unsigned, so Windows SmartScreen shows
          "Windows protected your PC" on first run. Choose **More info** then
          **Run anyway**. This is expected — no Authenticode certificate is
          configured yet (see docs/branding.md).

          The assisted installer offers a welcome page, install location and
          finish page. It installs per-user, so no administrator prompt.

          The application then opens on the account setup screen with Gmail and
          Microsoft cards. Sign-in itself needs `PHUTRUE_GOOGLE_CLIENT_ID` or
          `PHUTRUE_MICROSOFT_CLIENT_ID` set, and OAuth has not yet been tested
          against a real provider.
          "@ | Out-File (Join-Path $dir 'README.md') -Encoding utf8

          git config user.name 'phutrue-ci'
          git config user.email 'ci@users.noreply.github.com'
          git add $dir
          git commit -m "build: record installer checksum $hash [skip ci]"

          # GitHub returns an occasional 500 to a push. It is transient and the
          # checksum is the only record of this build, so retry before giving up.
          $pushed = $false
          for ($attempt = 1; $attempt -le 4; $attempt++) {
            git push origin "HEAD:${{ github.ref_name }}" 2>&1 | Tee-Object -FilePath push.log
            if ($LASTEXITCODE -eq 0) { $pushed = $true; break }
            Write-Host "push attempt $attempt failed; retrying in 15s"
            Start-Sleep -Seconds 15
          }

          if (-not $pushed) {
            $msg = ((Get-Content push.log -Raw) -replace "`r?`n", ' | ')
            if ($msg.Length -gt 700) { $msg = $msg.Substring(0, 700) }
            Write-Host "::error title=checksum push failed::$msg"
            exit 1
          }

      # Windows-only test failures were previously unreadable: the job log and
      # artifacts both live behind a host that cannot be reached from where the
      # run is reviewed. This commits the failure to the branch instead, which is
      # the one channel that works, so the next failure comes with its message.
      - name: Publish failure log to the branch
        if: failure()
        shell: pwsh
        run: |
          $log = 'ci-failure.txt'
          "Windows build failed" | Out-File -FilePath $log -Encoding utf8
          "commit: ${{ github.sha }}" | Out-File -FilePath $log -Append -Encoding utf8

          # Assertion messages are the point. Run the suite again with the
          # reporter that includes them, and append even if it fails again.
          npx vitest run --reporter=verbose *>> $log
          "exit code: $LASTEXITCODE" | Out-File -FilePath $log -Append -Encoding utf8

          git config user.name 'phutrue-ci'
          git config user.email 'ci@users.noreply.github.com'
          git add $log
          git commit -m "ci: Windows failure log [skip ci]"
          git push origin "HEAD:${{ github.ref_name }}" 2>&1 | Tee-Object -FilePath push.log
          if ($LASTEXITCODE -ne 0) {
            $msg = ((Get-Content push.log -Raw) -replace "`r?`n", ' | ')
            if ($msg.Length -gt 700) { $msg = $msg.Substring(0, 700) }
            Write-Host "::error title=failure log push failed::$msg"
          }

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phutrue-smoke-reports
          path: ci-failure.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload smoke reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phutrue-smoke-json
          path: |
            smoke-report.json
            installed-smoke-report.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Summary
        if: always()
        shell: pwsh
        run: |
          @"
          ## Windows build

          | | |
          |---|---|
          | Installer | ${{ steps.installer.outputs.name || 'not produced' }} |
          | SHA-256 | ``${{ steps.installer.outputs.sha256 || 'n/a' }}`` |
          | Commit | ``${{ github.sha }}`` |
          "@ >> $env:GITHUB_STEP_SUMMARY
