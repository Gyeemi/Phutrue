# Phutrue — electron-builder configuration
#
# Target: Windows x64, NSIS .exe installer.
#
# Every path under assets/generated/ is produced by `npm run assets` from
# assets/brand/phutrue-logo.png. Do not edit those files by hand.

appId: com.barailyinovex.phutrue
productName: Phutrue
copyright: Copyright © 2026 Baraily Inovex

# Maximum (LZMA) compression.
#
# Not cosmetic: with the default setting the NSIS installer is ~120 MB, which
# exceeds GitHub's 100 MB per-file limit and therefore cannot be delivered
# through a git branch. LZMA costs build time and makes the installer slightly
# slower to unpack on first run; both are worth it for a file that actually
# reaches the user.
compression: maximum

directories:
  output: release
  buildResources: assets/generated

# The multi-resolution .ico carries every size Windows asks for, from 16px in
# the taskbar overflow to 256px in large-icon Explorer views and Add/Remove
# Programs.
icon: assets/generated/icon.ico

files:
  # Only the build output ships. `src/` is excluded deliberately: the renderer
  # must never be able to reason about, or reach, the main-process sources.
  - dist/**/*
  - package.json
  # Sourcemaps and their .map companions are development aids; keeping them out
  # of the installer reduces size and avoids shipping readable internals.
  - '!dist/**/*.map'

# The renderer is served over the app:// protocol by reading files from disk.
# Keeping it outside the asar archive means those reads hit ordinary files, so
# the file handler cannot be caught out by archive-path edge cases that this
# environment has no way to test. The renderer bundle is not a secret anyway —
# it ships to every user.
asar: true
asarUnpack:
  - dist/renderer/**

# The window icon is read from disk at runtime, so the generated PNGs ship as
# resources beside the asar rather than being bundled inside it.
extraResources:
  - from: assets/generated
    to: assets/generated

# A name with the version and architecture in it, so a downloaded file is
# self-describing and two versions cannot be confused on disk.
artifactName: Phutrue-Setup-${version}-x64.${ext}

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: assets/generated/icon.ico
  # Code signing is not configured yet. Once an Authenticode certificate
  # exists, set it under signtoolOptions (electron-builder 26 moved these keys
  # off `win` itself):
  #
  #   signtoolOptions:
  #     certificateFile: build/cert.pfx
  #     certificatePassword: ${env.CSC_KEY_PASSWORD}
  #     publisherName: Baraily Inovex
  #
  # Until then Windows shows SmartScreen warnings on first run. See
  # docs/branding.md for why this is a real limitation and not a bug.

nsis:
  # An assisted (wizard) installer, because that is the only mode in which
  # NSIS renders installerHeader and installerSidebar at all.
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: true

  # Branding artwork. All three are 24-bit BMP with no alpha channel, which is
  # an NSIS Modern UI requirement, not a choice — see docs/branding.md.
  installerIcon: assets/generated/icon.ico
  uninstallerIcon: assets/generated/icon.ico
  installerSidebar: assets/generated/installerSidebar.bmp
  uninstallerSidebar: assets/generated/uninstallerSidebar.bmp
  installerHeader: assets/generated/installerHeader.bmp

  # installerHeaderIcon only applies to one-click installers, so it is
  # intentionally omitted.
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Phutrue

  # The updater must not delete user data. Settings, accounts and the mail
  # store live in %APPDATA%\Phutrue, outside the install directory, so the
  # uninstaller asks before removing them rather than assuming.
  deleteAppDataOnUninstall: false

  uninstallDisplayName: Phutrue
